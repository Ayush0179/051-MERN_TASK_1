
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Item Management System</h1>
            <p>Manage your items using CRUD operations</p>
        </header>

        <section class="form-section">
            <h2 id="form-title">Add New Item</h2>

            <form id="item-form">

                <input
                    type="text"
                    id="item-name"
                    placeholder="Enter item name"
                    required
                >

                <input
                    type="number"
                    id="item-price"
                    placeholder="Enter item price"
                    min="0"
                    step="0.01"
                    required
                >

                <div class="form-buttons">
                    <button type="submit" id="submit-btn">
                        Add Item
                    </button>

                    <button type="button" id="cancel-btn" hidden>
                        Cancel
                    </button>
                </div>

            </form>
        </section>

        <section class="items-section">

            <div class="section-heading">
                <h2>All Items</h2>
                <button id="refresh-btn" type="button">
                    Refresh
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Item Name</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="item-list">
                    </tbody>
                </table>
            </div>

            <p id="message" role="status"></p>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
